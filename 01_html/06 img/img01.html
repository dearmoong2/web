<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 태그</title>
  <style>
    body {
      background: #ccc;
    }
  </style>
</head>

<body>
  <!-- 
    img 태그의 속성
    1. src : 이미지 파일 경로
          · 웹 문서 파일의 위치를 기준으로 이미지 경로 지정 → 상대 경로
          · 서버에 파일이 올라가 있는 확실한 주소가 있다면 사용 가능 → 절대 경로
    2. alt : 대체 텍스트
          · 화면 낭독기가 읽어줌
          · 이미지를 표시할 수 없는 상황에는 대체 텍스트를 노출
  -->
  <!-- html과 이미지 파일이 같은 폴더에 있다면 src 속성에 파일 이름만 적용 or ./ -->
  <img src="./01.webp" alt="위켄드 The weeknd Starboy" height="400">
  <img src="./02.webp" alt="위켄드 The weeknd Dawn FM" height="400" />

  <!-- images라는 하위 폴더에 이미지 파일이 있다면 하위 폴더까지 경로에 같이 넣기 -->
  <div>
    <img src="./images/03.webp" alt="위켄드 The weeknd Beauty Behind The Madness" width="20%">
    <img src="./images/04.webp" alt="위켄드 The weeknd After Hours" width="500" height="500">
  </div>
  <!-- 상위, 상상위 폴더로 가기 -->
  <img src="../02_css/kakao.png" alt="카카오톡 로고">
  <img src="../../02_css/kakao.png" alt="카카오톡 로고">

  <!-- alt shift f : 자동 줄 정렬 -->
  <!-- 
   width(가로 사이즈), height(세로 사이즈) : 이미지 크기 조정하는 속성
   1. 위 속성을 사용하지 않으면 원래 이미지 크기대로 표시
   2. 위 속성을 이용해 화면에 표시하는 이미지 크기 조정, but 이미지 파일 용량은 그대로
  -->
</body>

</html>
