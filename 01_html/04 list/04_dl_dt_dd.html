<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>설명 목록</title>
</head>

<body>
  <!-- 제목과 그에 대한 설명으로 이루어진 목록 -->
  <!-- <dl>과 <dt>, <dd> 태그를 사용 -->
  <!-- 하나의 dt에 여러 개의 dd값을 가질 수 있음 -->
  <h2>설명 목록</h2>
  <dl>
    <dt>제목 1</dt>
    <dd>설명 1</dd>
    <dd>설명 2</dd>
    <dd>설명 3</dd>

    <dt>제목 2</dt>
    <dd>설명 1</dd>
    <dd>설명 2</dd>
    <dd>설명 3</dd>
  </dl>
</body>

</html>
