<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>label 태그</title>
</head>
<body>
  <!-- 폼(form) 요소에 label(텍스트)를 붙이는 태그 -->

  <!-- 방법 1 : label 태그로 묶기 -->
   <label>
    아이디(6자 이상) :
    <input type="text">
   </label>

  <!-- 방법 2 : id-for 사용 -->
   <label for="user_id"> 아이디(6자 이상) : </label>
   <input type="text" id="user_id"/>
</body>
</html>
