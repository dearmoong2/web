<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그라데이션 배경</title>
  <style>
    div {
      width: 500px;
      height: 500px;
      margin: 10px;
    }

    .gr1 {
      background: linear-gradient(135deg, #f6f6f6 0%, #ffe2e2 100%);
    }

    .gr2 {
      background: radial-gradient(circle at 50% 50%, #f6f6f6 0%, #ffe2e2 100%);
    }

    .gr3 {
      background: conic-gradient(from 135deg at 50% 50%, #f6f6f6 0 0%, #ffe2e2 100%, #f6f6f6 100%);
    }

    .gr4 {
      background-color: #ffe2e2;
      background-image:
        radial-gradient(circle at 50% 50%, #f6f6f6 0% 18%, transparent 34%),
        radial-gradient(circle at 82% 18%, color-mix(in oklch, #f6f6f6 48%, white) 0 16%, transparent 32%),
        radial-gradient(circle at 72% 76%, #ffe2e2 0 18%, transparent 36%),
        radial-gradient(circle at 24% 82%, color-mix(in oklch, #ffe2e2 55%, black) 0 16%, transparent 34%);
      background-blend-mode: screen, normal, multiply, normal;
    }

    .gr5 {
      background-color: #ffe2e2;
      background-image:
        radial-gradient(circle at 18% 26%, color-mix(in oklch, #f6f6f6 88%, white) 0 14%, transparent 38%),
        radial-gradient(circle at 82% 22%, color-mix(in oklch, #ffe2e2 74%, white) 0 16%, transparent 42%),
        repeating-radial-gradient(circle at 52% 58%, transparent 0 28px, color-mix(in oklch, #f6f6f6 34%, transparent) 29px 30px, transparent 31px 56px),
        conic-gradient(from 135deg at 50% 50%, #f6f6f6, #ffe2e2, color-mix(in oklch, #f6f6f6 42%, #ffe2e2), #f6f6f6);
      background-blend-mode: screen, lighten, overlay, normal;
    }

    .gr6 {
      background-color: #ffe2e2;
      background-image:
        radial-gradient(ellipse at 12% 24%, color-mix(in oklch, #f6f6f6 84%, white) 0 16%, transparent 46%),
        radial-gradient(ellipse at 82% 28%, color-mix(in oklch, #ffe2e2 76%, white) 0 18%, transparent 48%),
        radial-gradient(ellipse at 52% 84%, color-mix(in oklch, #f6f6f6 52%, #ffe2e2) 0 22%, transparent 54%),
        radial-gradient(circle, rgba(255, 255, 255, .18) 0 1px, transparent 1px),
        linear-gradient(135deg, color-mix(in oklch, #ffe2e2 82%, black), color-mix(in oklch, #f6f6f6 18%, #ffe2e2));
      background-size: 100% 100%, 100% 100%, 100% 100%, 10px 10px, 100% 100%;
      background-blend-mode: screen, lighten, overlay, soft-light, normal;
    }
  </style>
</head>

<body>
  <div class="gr1"></div>
  <div class="gr2"></div>
  <div class="gr3"></div>
  <div class="gr4"></div>
  <div class="gr5"></div>
  <div class="gr6"></div>
</body>

</html>
