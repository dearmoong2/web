<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nth-child</title>
  <style>
    :root {
      font-size: 20px;
      --font-color: #333;
      --point-color1: red;
      --point-color2: blue;
      --point-color3: green;
    }

    ul {
      list-style: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    nav ul li {
      width: 120px;
      height: 30px;
      line-height: 30px;
      text-align: center;
      border: 1px solid var(--point-color1);
    }

    nav ul li:nth-child(2) {
      background: var(--point-color2);
    }

    /* even : 짝수 */
    nav ul li:nth-child(even) {
      background: var(--point-color3);
    }

    /* odd : 홀수 */
    nav ul li:nth-child(odd) {
      background: var(--point-color1);
    }

    nav ul li:nth-child(2) a {
      background: pink;
    }

    nav ul li:first-child {
      background: lightblue;
    }

    nav ul li:last-child {
      background: lightblue;
    }

    nav ul li:nth-last-child(2) {
      background: lightcoral;
    }

    nav ul li:nth-child(5):hover a {
      /* font-size: 2rem; */
      background: yellow;
    }

    nav ul li:nth-child(3):hover {
      background: lightseagreen;
    }
  </style>
</head>

<body>
  <nav>
    <ul>
      <li><a href="#">메뉴 1</a></li>
      <li><a href="#">메뉴 2</a></li>
      <li><a href="#">메뉴 3</a></li>
      <li><a href="#">메뉴 4</a></li>
      <li><a href="#">메뉴 5</a></li>
      <li><a href="#">메뉴 6</a></li>
      <li><a href="#">메뉴 7</a></li>
      <li><a href="#">메뉴 8</a></li>
    </ul>
  </nav>
</body>

</html>
