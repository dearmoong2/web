<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>border-radius</title>
  <style>
    div {
      margin: 0;
      padding: 0;
    }

    .wrap {
      width: 100%;
      height: auto;
      display: flex;
    }

    div {
      width: 300px;
      height: 200px;
      margin: 20px;
      background: rgba(0, 255, 0, 0.1);
    }

    .round {
      border-radius: 20px;
      border: 1px solid red;
      border-radius: 0 20px 30px 40px;
      border-bottom-left-radius: 0;
    }

    #bg {
      border-radius: 50%;
      width: 100px;
      height: 100px;
      background: url(https://i.namu.wiki/i/-0BnCB3QaeOIiDJ1MzXhLVJIYNPMGCRVrZojLG-P36K7PJw6Y2-NgGTq5noYPgFrO53Rxq3i5h5Bxt_rL6HUWA.webp) no-repeat center/cover;
    }

    .radius {
      border: 1px solid blue;
      border-radius: 60px/20px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="round"></div>
    <div class="round" id="bg"></div>
    <div class="radius">60px/20px</div>
  </div>
</body>

</html>
